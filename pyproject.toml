[project]
name = "tripmate"
version = "0.1.0"
description = "TripMate, the scripted travel agent for the AI Agent Observability workshop"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "langchain-core==1.6.12",
    "langchain-openai==1.7.2",
    "langfuse==5.0.2",
    "langgraph==1.2.16",
    "python-dotenv>=1.0",
]

[project.scripts]
ws = "tripmate.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tripmate"]

[tool.hatch.build.targets.wheel.force-include]
"evals/booking_matches.py" = "tripmate/evals/booking_matches.py"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["evals/booking_matches.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "C4", "PIE", "RET"]

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src", "tests", "scripts"]
disallow_any_explicit = true

[[tool.mypy.overrides]]
module = "tripmate.llm"
disallow_any_explicit = false

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["tripmate", "evals"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
