name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standards:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: "3.12"
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - run: npm ci
      - run: uv sync --locked --extra openai
      - run: uv run python scripts/standards.py
      - name: plain install, as attendees get it
        run: uv sync --locked
      - run: uv run --no-sync python -c "import tripmate.cli, tripmate.doctor"
      - run: uv run --no-sync ws case 0 --exporter console
      - run: uv run --no-sync pytest --ignore=tests/test_openai_mode.py -q
